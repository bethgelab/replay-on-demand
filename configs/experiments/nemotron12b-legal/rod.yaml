# Nemotron-Nano-12B-v2 (base), legal adaptation — rod
#
# RoD: at every step, score the candidates C_A and C_R (|C_A| + |C_R| = m*k = 2048, m = 2)
# with their source-specific reducible loss, rho_A = l(theta_t) - l(theta_ref^A) and
# rho_R = l(theta_t) - l(theta_0), and train on the joint top-k (k = 1024). Same trained-token
# budget and schedule as the compute-matched baselines. Writes the per-step selection
# trace (<log_dir>/selected_samples.jsonl).
#
# Batch: candidate pool 2048 = m*k with m=2, trained batch k=1024 blocks of 4096 tokens.
# Schedule: 2958 steps, WSD over 2958 steps: 50 warmup, constant LR 0.00012,
#   then cosine decay to 1.2e-05 over the last 616 steps.
#   (scheduler iters in this file are in pool-sized units, i.e. optimizer steps / m;
#   see configs/experiments/README.md)
#
# ROD_MODEL_DIR: the base model, Nemotron-Nano-12B-v2 (base).
# Paper runs used 2 node(s) x 8 GPUs.
# Launch: sbatch slurm/40_train.sbatch configs/experiments/nemotron12b-legal/rod.yaml

sft:
  max_num_steps: 2958
  val_period: 100
  val_batches: 100
  val_global_batch_size: 64
  val_micro_batch_size: 8
rod:
  top_k: 1024
  enable_selection: true
data_mixer:
  max_val_samples_per_origin: 500
  adapt_domain: legal
  replay_share: 1.0
policy:
  train_global_batch_size: 2048
  megatron_cfg:
    optimizer:
      lr: 0.00012
      min_lr: 1.2e-05
    scheduler:
      lr_decay_style: WSD
      lr_wsd_decay_style: cosine
      lr_wsd_decay_iters: 308
      lr_decay_iters: 1479
      lr_warmup_iters: 25
checkpointing:
  save_period: 400
  keep_top_k: 10
cluster:
  num_nodes: 2
